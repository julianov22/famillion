<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Famillion</title>
<style>
:root{--bg:#faf9f6;--card:#fff;--text:#1f1e1b;--muted:#6b6a65;--border:#e3e1da;--accent:#2457c5;--on-accent:#fff;--accent-bg:#e6effd;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#201f1c;--text:#ecebe6;--muted:#a09f99;--border:#38372f;--accent:#8fb3ff;--on-accent:#0b1530;--accent-bg:#1e2a44;--danger:#ff8a7a}}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:12px}
h1{font-size:24px;margin:0 0 8px}h2{font-size:19px;margin:0 0 16px}
p{margin:0 0 16px}.muted{color:var(--muted);font-size:14px;margin:0 0 4px}
input{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
button.ghost{background:none;color:var(--accent);border-color:var(--border)}
button:disabled{opacity:.6}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:6px 0}
.dots{display:flex;gap:6px;margin-bottom:16px}.dots i{flex:1;height:4px;border-radius:2px;background:var(--border)}.dots i.on{background:var(--accent)}
.row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:15px}
.row .label{flex:1;min-width:0;overflow-wrap:anywhere}
.bar{width:80px;height:8px;border-radius:4px;background:var(--border);overflow:hidden;flex-shrink:0}.bar i{display:block;height:100%;background:var(--muted)}
.mine{font-weight:600}.mine .bar i{background:var(--accent)}
.pts{font-size:13px;color:var(--muted);white-space:nowrap;min-width:72px;text-align:right}
.tag{background:var(--accent-bg);color:var(--accent);font-size:12px;padding:1px 8px;border-radius:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.stats .card{margin:0}.stats b{display:block;font-size:26px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px}.lang button{padding:4px 12px;font-size:13px}.lang button[aria-pressed=true]{background:var(--accent-bg)}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}details .muted{margin:0 0 6px}
</style>
</head>
<body>
<main id="app"><div class="card"><p class="muted">Loading…</p></div></main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { norm, points, dayKey, dayNumber, pickPrompts, promptText, score } from './game.js';

// Settings. The key is Supabase's public anon/publishable key, safe to expose (RLS protects the data).
const SUPABASE_URL = 'https://skbzynccpjjltrweyjcr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TC2DTPoGru0qaKWiqyyNkw_7X0HXQTh';
const START = '2026-12-20';     // Day 1. Days before it are practice rounds.
const TZ = 'Europe/Amsterdam';  // Keep in sync with family_today() in schema.sql

const T = {
  en: {
    tagline: 'A daily game of 7 prompts about the family. Rarer answers score more.',
    whoAreYou: 'What does the family call you?', namePh: 'Your name', join: 'Join',
    enterName: 'Enter your name first', nameTaken: 'Someone already uses that name. Try another.',
    day: n => `Day ${n}`, practice: d => `Practice round · the game starts on ${d}`,
    todayTitle: "Today's 7 prompts",
    hi: name => `Hi ${name}. Give one answer per prompt. The fewer people who say the same thing, the more points you get. You can play once a day.`,
    start: 'Start', yesterdayResults: "Yesterday's results",
    promptOf: i => `Prompt ${i} of 7`, answerPh: 'Your answer', next: 'Next', finish: 'Finish',
    enterAnswer: 'Enter an answer first', newDay: 'A new day just started. Reload the page to get the new prompts.',
    today: 'Today', yesterday: 'Yesterday', nobody: 'Nobody played that day.', refresh: 'Refresh', back: 'Back',
    yourScore: 'Your score', yourRank: 'Your rank', rankOf: (r, n) => `#${r} of ${n}`, you: 'You', pts: 'pts',
    played: (n, live) => `${n} played${live ? ' so far · scores change as more people play' : ''}`,
    rules: 'Only you said it = 3 points · two people = 2 · three or more = 1. Tap an answer to see who said it.',
    oops: 'Something went wrong', reload: 'Reload',
  },
  es: {
    tagline: 'Un juego diario de 7 preguntas sobre la familia. Las respuestas más raras puntúan más.',
    whoAreYou: '¿Cómo te llama la familia?', namePh: 'Tu nombre', join: 'Entrar',
    enterName: 'Escribe tu nombre primero', nameTaken: 'Alguien ya usa ese nombre. Prueba otro.',
    day: n => `Día ${n}`, practice: d => `Ronda de práctica · el juego empieza el ${d}`,
    todayTitle: 'Las 7 preguntas de hoy',
    hi: name => `Hola, ${name}. Da una respuesta por pregunta. Cuanta menos gente diga lo mismo, más puntos ganas. Puedes jugar una vez al día.`,
    start: 'Empezar', yesterdayResults: 'Resultados de ayer',
    promptOf: i => `Pregunta ${i} de 7`, answerPh: 'Tu respuesta', next: 'Siguiente', finish: 'Terminar',
    enterAnswer: 'Escribe una respuesta primero', newDay: 'Acaba de empezar un nuevo día. Recarga la página para ver las preguntas nuevas.',
    today: 'Hoy', yesterday: 'Ayer', nobody: 'Nadie jugó ese día.', refresh: 'Actualizar', back: 'Volver',
    yourScore: 'Tu puntuación', yourRank: 'Tu posición', rankOf: (r, n) => `#${r} de ${n}`, you: 'Tú', pts: 'ptos',
    played: (n, live) => `Han jugado ${n}${live ? ' hasta ahora · los puntos cambian según juegue más gente' : ''}`,
    rules: 'Solo tú lo dijiste = 3 puntos · dos personas = 2 · tres o más = 1. Toca una respuesta para ver quién la dijo.',
    oops: 'Algo salió mal', reload: 'Recargar',
  },
};
let lang = 'en';
try { if (localStorage.getItem('lang') === 'es') lang = 'es'; } catch {}
const t = () => T[lang];
let redraw = () => home(); // re-renders the current screen after a language switch

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const show = html => {
  document.documentElement.lang = lang;
  app.innerHTML = `<div class="lang">${[['en', 'English'], ['es', 'Español']].map(([l, name]) =>
    `<button class="ghost" data-lang="${l}" aria-pressed="${l === lang}">${name}</button>`).join('')}</div>${html}`;
  app.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('lang', lang); } catch {}
    redraw();
  });
  scrollTo(0, 0);
};
const card = html => `<div class="card">${html}</div>`;
const fail = msg => show(card(`<h2>${t().oops}</h2><p>${esc(msg)}</p><button onclick="location.reload()">${t().reload}</button>`));

// Wires the #in input and #ok button. fn returns an error message to show, or nothing.
function onSubmit(fn, emptyMsg) {
  const input = document.getElementById('in'), ok = document.getElementById('ok'), err = document.getElementById('err');
  input.focus();
  input.oninput = () => (err.textContent = '');
  const go = async () => {
    const v = input.value.trim();
    if (!norm(v)) return (err.textContent = emptyMsg());
    ok.disabled = true;
    const msg = await fn(v);
    ok.disabled = false;
    if (msg) err.textContent = msg;
  };
  ok.onclick = go;
  input.onkeydown = e => e.key === 'Enter' && go();
}

if (!SUPABASE_URL || !SUPABASE_KEY) {
  show(card('<h1>Almost there</h1><p>Add your Supabase URL and key at the top of <code>index.html</code>. The README has the steps.</p>'));
  throw new Error('Supabase is not configured');
}

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const today = dayKey(TZ);
const yesterday = dayKey(TZ, new Date(Date.now() - 864e5));
const n = dayNumber(START, today);
const lines = (await (await fetch('prompts.txt')).text()).split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#'));
if (lines.length < 7) { fail('prompts.txt needs at least 7 prompts.'); throw new Error('Not enough prompts'); }
const todays = pickPrompts(lines, n);
const startDate = () => new Date(`${START}T12:00:00Z`).toLocaleDateString(lang === 'es' ? 'es-ES' : 'en-GB', { day: 'numeric', month: 'long', timeZone: 'UTC' });
let me = null; // { id, name }

async function home() {
  redraw = home;
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const { data } = await sb.from('players').select('id, name').eq('id', session.user.id).maybeSingle();
    me = data;
  }
  if (!me) return askName();
  const { count, error } = await sb.from('answers').select('*', { count: 'exact', head: true }).eq('day', today).eq('player_id', me.id);
  if (error) return fail(error.message);
  if (count >= 7) return results(today);
  show(card(`<p class="muted">${n < 1 ? t().practice(startDate()) : t().day(n)}</p><h1>${t().todayTitle}</h1>
    <p>${t().hi(esc(me.name))}</p>
    <div class="actions"><button id="go">${t().start}</button><button class="ghost" id="yday">${t().yesterdayResults}</button></div>`));
  document.getElementById('go').onclick = () => ask();
  document.getElementById('yday').onclick = () => results(yesterday);
}

function askName() {
  redraw = askName;
  show(card(`<h1>Famillion</h1><p>${t().tagline}</p>
    <p class="muted">${t().whoAreYou}</p>
    <input id="in" maxlength="30" placeholder="${t().namePh}" autocomplete="off"><p class="err" id="err"></p><button id="ok">${t().join}</button>`));
  onSubmit(async name => {
    if (!(await sb.auth.getSession()).data.session) {
      const { error } = await sb.auth.signInAnonymously();
      if (error) return error.message;
    }
    const { error } = await sb.from('players').insert({ name });
    if (error) return error.code === '23505' ? t().nameTaken : error.message;
    home();
  }, () => t().enterName);
}

function ask(i = 0, answers = []) {
  redraw = () => ask(i, answers);
  show(card(`<div class="dots">${todays.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
    <p class="muted">${t().promptOf(i + 1)}</p><h2>${esc(promptText(todays[i], lang))}</h2>
    <input id="in" maxlength="100" placeholder="${t().answerPh}" autocomplete="off"><p class="err" id="err"></p>
    <button id="ok">${i < 6 ? t().next : t().finish}</button>`));
  onSubmit(async answer => {
    answers[i] = answer;
    if (i < 6) return ask(i + 1, answers);
    // Stores the whole "English | Español" line so results show in each viewer's language.
    const { error } = await sb.from('answers').insert(answers.map((answer, idx) => ({ day: today, idx, prompt: todays[idx], answer })));
    if (error?.code === '42501') return t().newDay;
    if (error && error.code !== '23505') return error.message; // 23505 = already played, show results
    results(today);
  }, () => t().enterAnswer);
}

async function results(day) {
  redraw = () => results(day);
  const { data, error } = await sb.from('answers').select('idx, prompt, answer, players(name)').eq('day', day);
  if (error) return fail(error.message);
  const isToday = day === today;
  const label = isToday ? t().today : day === yesterday ? t().yesterday : day;
  const nav = `<div class="actions">${isToday
    ? `<button class="ghost" id="refresh">${t().refresh}</button><button class="ghost" id="yday">${t().yesterdayResults}</button>`
    : `<button class="ghost" id="back">${t().back}</button>`}</div>`;
  if (!data.length) {
    show(card(`<h2>${label}</h2><p>${t().nobody}</p>${nav}`));
  } else {
    const { prompts, totals } = score(data.map(r => ({ ...r, name: r.players.name })));
    const board = Object.entries(totals).sort((a, b) => b[1] - a[1]);
    const players = board.length;
    const mine = me && totals[me.name] !== undefined;
    const rank = mine ? board.filter(([, s]) => s > totals[me.name]).length + 1 : null;
    show(`${mine ? `<div class="stats"><div class="card"><p class="muted">${t().yourScore}</p><b>${totals[me.name]} / 21</b></div>
      <div class="card"><p class="muted">${t().yourRank}</p><b>${t().rankOf(rank, players)}</b></div></div>` : ''}
      <div class="card"><p class="muted">${label} · ${t().played(players, isToday)}</p>
      ${board.map(([name, s], k) => `<div class="row ${me?.name === name ? 'mine' : ''}"><span style="width:20px" class="muted">${k + 1}</span><span class="label">${esc(name)}</span><span class="pts">${s} ${t().pts}</span></div>`).join('')}
      </div>
      ${prompts.map((p, k) => p && card(`<p class="muted">${k + 1}. ${esc(promptText(p.text, lang))}</p>${p.groups.map(g => {
        const isMine = me && g.who.includes(me.name);
        return `<details><summary class="row ${isMine ? 'mine' : ''}"><span class="label">${esc(g.label)}</span>${isMine ? `<span class="tag">${t().you}</span>` : ''}
          <span class="bar"><i style="width:${Math.round(g.who.length / players * 100)}%"></i></span><span class="pts">${g.who.length}× · ${points(g.who.length)} ${t().pts}</span></summary>
          <p class="muted">${esc(g.who.join(', '))}</p></details>`;
      }).join('')}`)).join('')}
      ${card(`<p class="muted">${t().rules}</p>${nav}`)}`);
  }
  document.getElementById('refresh')?.addEventListener('click', () => results(today));
  document.getElementById('yday')?.addEventListener('click', () => results(yesterday));
  document.getElementById('back')?.addEventListener('click', home);
}

home().catch(e => fail(e.message));
</script>
</body>
</html>
